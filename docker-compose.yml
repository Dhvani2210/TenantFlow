services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5253:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      SA_PASSWORD: "${SA_PASSWORD}"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TenantFlowDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata: